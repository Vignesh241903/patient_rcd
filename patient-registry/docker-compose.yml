services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: patient_registry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tamil123
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/patient_registry
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"