<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Patient Registry'">Patient Registry</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
        <div class="brand-mark">+</div>
        <div>
            <strong>Patient Registry</strong>
            <small>Hospital workspace</small>
        </div>
    </div>
    <nav>
        <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active' : ''">Dashboard</a>
        <a th:href="@{/patients/new}" th:classappend="${active == 'register'} ? 'active' : ''">Register patient</a>
        <a th:href="@{/patients}" th:classappend="${active == 'patients'} ? 'active' : ''">Patients</a>
    </nav>
</aside>
</html>
