<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: sidebar('dashboard')}"></aside>

    <main class="main">
        <header class="topbar">Dashboard</header>

        <div class="content">
            <div class="page-heading">
                <div>
                    <h1>Dashboard</h1>
                    <p>Overview of registered patients.</p>
                </div>
                <a class="btn primary" th:href="@{/patients/new}">+ Register patient</a>
            </div>

            <section class="cards">
                <div class="card"><span>Total patients</span><strong th:text="${total}">0</strong></div>
                <div class="card"><span>Admitted</span><strong th:text="${admitted}">0</strong></div>
                <div class="card"><span>Outpatients</span><strong th:text="${outpatients}">0</strong></div>
                <div class="card"><span>Registered today</span><strong th:text="${today}">0</strong></div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Recent registrations</h2>
                    <a th:href="@{/patients}">View all</a>
                </div>
                <table>
                    <thead>
                    <tr><th>Patient</th><th>Ward</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${recent}">
                        <td>
                            <strong th:text="${p.fullName}"></strong><br>
                            <small th:text="${p.patientCode}"></small>
                        </td>
                        <td th:text="${p.ward}"></td>
                        <td>
                            <span class="badge" th:text="${p.status == 'ADMITTED' ? 'Admitted' : 'Outpatient'}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recent)}">
                        <td colspan="3" class="empty">No patients registered yet.</td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>
</div>
</body>
</html>
